name: Deploy demo site to GitHub Pages

# Публикует содержимое site/ в ветку gh-pages.
# В Settings → Pages источником должна быть ветка gh-pages (папка /).
on:
  push:
    branches: [claude/web-platform-visual-config-u1o9je, main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
